name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            react/package-lock.json
            site-next/package-lock.json

      - name: Install dependencies
        working-directory: react
        run: npm ci

      - name: Build Storybook
        working-directory: react
        run: npm run build-storybook -- --output-dir ../deploy/storybook

      - name: Install site-next dependencies
        working-directory: site-next
        run: npm ci

      - name: Build site-next
        working-directory: site-next
        env:
          NEXT_BASE_PATH: /digilawyer-design-system/site-next
        run: npm run build

      - name: Copy HTML docs
        run: cp -r docs/. deploy/

      - name: Copy site-next
        run: cp -r site-next/out deploy/site-next

      - name: Add .nojekyll
        run: touch deploy/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
